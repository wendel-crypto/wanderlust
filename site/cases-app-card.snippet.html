 <script>/* wf-case-wanderlust: adds the Wanderlust card to Cases > App; the case page is standalone HTML at /wanderlust/ */(function(){var busy=false;function sync(){if(busy)return;busy=true;try{var card=document.getElementById("wf-wanderlust-card");var src=document.querySelector("a[href='/cases/rundate-miami']");if(!src){if(card)card.remove();return;}if(card&&card.parentElement===src.parentElement)return;if(card)card.remove();card=src.cloneNode(true);card.id="wf-wanderlust-card";card.setAttribute("href","/wanderlust/");var media=card.children[0],body=card.children[1];if(media){media.innerHTML="<img src='https://raw.githubusercontent.com/wendel-crypto/wanderlust/main/docs/cover.jpg' alt='Wanderlust app screens' style='width:100%;height:100%;object-fit:cover;display:block'>";}if(body){var k=body.children;if(k[0])k[0].textContent="Product concept \u00b7 Mobile app \u00b7 UX + prototype";if(k[1])k[1].textContent="Wanderlust";if(k[2])k[2].textContent="A travel social app that mixes Instagram-style trip sharing with TripAdvisor-style reviews: geotagged posts, ratings, a map and DMs that turn a provider post into a booking.";if(k[3]&&k[3].children.length){var t0=k[3].children[0];k[3].innerHTML="";["Mobile app","UX / UI","Prototype","Social","Travel"].forEach(function(x){var n=t0.cloneNode(false);n.textContent=x;k[3].appendChild(n);});}}src.parentElement.appendChild(card);}catch(e){}finally{busy=false;}}function start(){new MutationObserver(sync).observe(document.body,{childList:true,subtree:true});sync();}if(document.body)start();else document.addEventListener("DOMContentLoaded",start);})();</script>
